<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مهدی رضایی‌فر</title>
<meta name="description" content="توسعه‌دهنده بک‌اند، موبایل و وب">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f5f7;
    --ink: #14202b;
    --muted: #5b6b79;
    --line: #d5dde3;
    --accent: #1f5fbf;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10181f;
      --ink: #e6edf2;
      --muted: #93a3b1;
      --line: #263540;
      --accent: #6ea4f0;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 4rem 1.25rem 3rem;
    background: var(--bg);
    color: var(--ink);
    font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.9;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 {
    margin: 0 0 .25rem;
    font-size: clamp(2.25rem, 8vw, 3.5rem);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.01em;
  }
  .role { margin: 0 0 2rem; color: var(--muted); }
  h2 { margin: 2.5rem 0 .5rem; font-size: 1.125rem; font-weight: 800; }
  p { margin: 0 0 1rem; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: .6rem 0; border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }
  li span { color: var(--muted); display: block; font-size: .95rem; }
  a { color: var(--accent); text-underline-offset: .25em; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .cta {
    display: inline-block;
    margin-top: .5rem;
    padding: .55rem 1.25rem;
    background: var(--accent);
    color: var(--bg);
    font-weight: 500;
    text-decoration: none;
    border-radius: .4rem;
  }
  .cta:hover { filter: brightness(1.1); }
  footer { margin-top: 3rem; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>مهدی رضایی‌فر</h1>
  <p class="role">توسعه‌دهنده بک‌اند، موبایل و وب</p>

  <p>
    با پایتون، Go، فلاتر و ری‌اکت کار می‌کنم. بیشتر روی ابزارهای تلگرام،
    ابزارهای شبکه و اتوماسیون کار می‌کنم.
  </p>
  <a class="cta" href="resume.pdf">دانلود رزومه</a>

  <h2>پروژه‌ها</h2>
  <ul>
    <li>
      <a href="https://github.com/mehdirzfx">همه پروژه‌ها در گیت‌هاب</a>
      <span>کدها و ابزارهای متن‌باز</span>
    </li>
    <!-- برای هر پروژه جدید یک li مثل این اضافه کنید:
    <li>
      <a href="/REPO-NAME/">نام پروژه</a>
      <span>توضیح کوتاه</span>
    </li>
    -->
  </ul>

  <h2>ارتباط</h2>
  <ul>
    <li><a href="https://github.com/mehdirzfx">github.com/mehdirzfx</a></li>
  </ul>

  <footer>© مهدی رضایی‌فر</footer>
</main>
</body>
</html>
